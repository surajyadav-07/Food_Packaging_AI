<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="markPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="markLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="22" fill="#FFF8E1" stroke="#FF8A00" stroke-width="2"/>

  <!-- Package Geometry -->
  <path d="M 50 14 L 84 32 L 84 70 L 50 88 L 16 70 L 16 32 Z" fill="#FFFDF5" stroke="#FF8A00" stroke-width="1.5" />
  <path d="M 50 14 L 84 32 L 50 50 L 16 32 Z" fill="#FFE082" stroke="#FF8A00" stroke-width="1.5" />
  <path d="M 16 32 L 50 50 L 50 88 L 16 70 Z" fill="#FFD54F" stroke="#FF8A00" stroke-width="1.5" />
  <path d="M 84 32 L 50 50 L 50 88 L 84 70 Z" fill="#FFCA28" stroke="#FF8A00" stroke-width="1.5" />

  <!-- Organic Sustainable Leaf -->
  <path d="M 28 60 C 28 35, 58 24, 72 22 C 72 44, 58 74, 38 78 C 32 79, 28 74, 28 60 Z" 
        fill="url(#markLeaf)" fill-opacity="0.95" />
  <path d="M 32 74 Q 50 48 70 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3" />

  <!-- AI Nodes -->
  <circle cx="50" cy="14" r="4" fill="#FF5722" filter="url(#markGlow)" />
  <circle cx="84" cy="32" r="4" fill="#FF8A00" filter="url(#markGlow)" />
  <circle cx="84" cy="70" r="3.5" fill="#FFB300" />
  <circle cx="50" cy="88" r="4" fill="#2E7D32" filter="url(#markGlow)" />
  <circle cx="16" cy="70" r="3.5" fill="#FF8A00" />
  <circle cx="16" cy="32" r="4" fill="#FF5722" />
  <circle cx="50" cy="50" r="4.5" fill="#FF8A00" filter="url(#markGlow)" />
</svg>
