<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#F8FAFC" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="lugCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="16" fill="#151F30"/>
  <!-- Metal Lug Lug Closure Cap -->
  <rect x="70" y="24" width="60" height="16" rx="4" fill="url(#lugCap)" stroke="#78350F" stroke-width="1.5"/>
  <rect x="74" y="38" width="52" height="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
  <!-- Soda-Lime Glass Jar Body -->
  <path d="M 65 44 L 135 44 L 145 60 L 145 130 C 145 138, 138 142, 130 142 L 70 142 C 62 142, 55 138, 55 130 L 55 60 Z" fill="url(#glassBody)" stroke="#38BDF8" stroke-width="2"/>
  <!-- Glass Thickness Reflection Highlight -->
  <path d="M 63 65 L 63 125" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 70 65 L 70 125" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Absolute Barrier Label -->
  <rect x="68" y="80" width="64" height="30" rx="3" fill="#0B1220" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1"/>
  <text x="100" y="93" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#38BDF8" text-anchor="middle">ZERO-PERM</text>
  <text x="100" y="104" font-family="sans-serif" font-size="7" font-weight="600" fill="#CBD5E1" text-anchor="middle">WVTR / OTR = 0.0</text>
  <!-- Badge -->
  <rect x="14" y="14" width="88" height="18" rx="9" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <circle cx="23" cy="23" r="3" fill="#38BDF8"/>
  <text x="32" y="26" font-family="sans-serif" font-size="8" font-weight="700" fill="#F8FAFC">RIGID GLASS</text>
</svg>
