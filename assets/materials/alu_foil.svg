<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="aluSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="16" fill="#151F30"/>
  <!-- Retort Foil Pouch 3-Side Sealed -->
  <path d="M 45 35 L 155 35 L 155 135 L 45 135 Z" fill="url(#aluSheen)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Wide 10mm hermetic seals on three sides -->
  <rect x="45" y="35" width="110" height="12" fill="#64748B" fill-opacity="0.3"/>
  <rect x="45" y="47" width="12" height="76" fill="#64748B" fill-opacity="0.3"/>
  <rect x="143" y="47" width="12" height="76" fill="#64748B" fill-opacity="0.3"/>
  <rect x="45" y="123" width="110" height="12" fill="#64748B" fill-opacity="0.3"/>
  <!-- Embossed seal waffle texture -->
  <line x1="50" y1="38" x2="150" y2="38" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="50" y1="42" x2="150" y2="42" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Central specifications card -->
  <rect x="64" y="65" width="72" height="42" rx="4" fill="#0B1220" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1"/>
  <text x="100" y="80" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#38BDF8" text-anchor="middle">ALU-FOIL BARRIER</text>
  <text x="100" y="92" font-family="sans-serif" font-size="7" font-weight="600" fill="#CBD5E1" text-anchor="middle">PET / Al / PE (90 µm)</text>
  <text x="100" y="101" font-family="sans-serif" font-size="6.5" font-weight="500" fill="#22C55E" text-anchor="middle">Total Light &amp; Gas Block</text>
  <!-- Badge -->
  <rect x="14" y="14" width="84" height="18" rx="9" fill="#1E293B" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="23" cy="23" r="3" fill="#CBD5E1"/>
  <text x="32" y="26" font-family="sans-serif" font-size="8" font-weight="700" fill="#F8FAFC">ALU LAMINATE</text>
</svg>
