<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="16" fill="#151F30"/>
  <!-- Gable Top Folding Paperboard Carton -->
  <!-- Main Face -->
  <polygon points="60,65 110,55 110,135 60,135" fill="url(#kraftGrad)" stroke="#B45309" stroke-width="1.5"/>
  <!-- Side Face -->
  <polygon points="110,55 140,65 140,135 110,135" fill="#78350F" stroke="#B45309" stroke-width="1.5"/>
  <!-- Top Roof Slope Front -->
  <polygon points="60,65 110,55 95,35 45,45" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
  <!-- Top Roof Slope Side -->
  <polygon points="110,55 140,65 125,45 95,35" fill="#D97706" stroke="#B45309" stroke-width="1.5"/>
  <!-- Gable Ridge Fin Seal -->
  <polygon points="45,45 95,35 95,25 45,35" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
  <!-- PE Barrier Extrusion Coating Callout -->
  <rect x="68" y="80" width="64" height="28" rx="3" fill="#0B1220" fill-opacity="0.85" stroke="#F59E0B" stroke-width="1"/>
  <text x="100" y="92" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#FDE68A" text-anchor="middle">PE-COATED BOARD</text>
  <text x="100" y="102" font-family="sans-serif" font-size="7" font-weight="600" fill="#CBD5E1" text-anchor="middle">250 gsm / 18 µm</text>
  <!-- Badge -->
  <rect x="14" y="14" width="82" height="18" rx="9" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="23" cy="23" r="3" fill="#F59E0B"/>
  <text x="32" y="26" font-family="sans-serif" font-size="8" font-weight="700" fill="#F8FAFC">PAPERBOARD</text>
</svg>
