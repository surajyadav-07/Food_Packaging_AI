<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="foilSheenMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="pouchShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="16" fill="#151F30"/>
  <!-- Doypack / Stand-up Foil Barrier Pouch -->
  <path d="M 50 35 L 150 35 L 160 125 C 160 135, 130 142, 100 142 C 70 142, 40 135, 40 125 Z" fill="url(#pouchShadow)" stroke="#475569" stroke-width="2"/>
  <path d="M 55 42 L 145 42 L 153 120 C 153 128, 128 134, 100 134 C 72 134, 47 128, 47 120 Z" fill="url(#foilSheenMat)" opacity="0.9"/>
  <!-- Top Zip-lock line -->
  <line x1="53" y1="52" x2="147" y2="52" stroke="#1E293B" stroke-width="2" stroke-dasharray="2 3"/>
  <!-- Heat-seal crimp marks -->
  <rect x="48" y="30" width="104" height="10" rx="2" fill="#334155" stroke="#14B8A6" stroke-width="1.5"/>
  <!-- Micro Barrier Spec Text -->
  <rect x="62" y="74" width="76" height="32" rx="4" fill="#0B1220" fill-opacity="0.8" stroke="#14B8A6" stroke-width="1"/>
  <text x="100" y="87" font-family="sans-serif" font-size="8" font-weight="700" fill="#38BDF8" text-anchor="middle">METALLIZED FOIL</text>
  <text x="100" y="99" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">WVTR &lt; 0.5 g/m²</text>
  <!-- Material Family Badge -->
  <rect x="14" y="14" width="82" height="18" rx="9" fill="#1E293B" stroke="#14B8A6" stroke-width="1"/>
  <circle cx="23" cy="23" r="3" fill="#14B8A6"/>
  <text x="32" y="26" font-family="sans-serif" font-size="8" font-weight="700" fill="#F8FAFC">MET-LAMINATE</text>
</svg>
