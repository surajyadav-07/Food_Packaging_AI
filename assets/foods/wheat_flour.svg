<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="bgAtta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFF8E1"/>
    </linearGradient>
    <linearGradient id="sackGradAtta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="wheatSpike" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="16" fill="url(#bgAtta)" stroke="#FFE082" stroke-width="2"/>
  <circle cx="170" cy="35" r="22" fill="#FFE082" opacity="0.3"/>
  <!-- Flour Sack Bag -->
  <path d="M 65 52 C 65 48, 135 48, 135 52 L 138 120 C 138 124, 62 124, 62 120 Z" fill="url(#sackGradAtta)" stroke="#F57C00" stroke-width="2"/>
  <path d="M 60 48 Q 100 42 140 48 L 138 56 Q 100 50 62 56 Z" fill="#FFE082" stroke="#F57C00" stroke-width="1.5"/>
  <!-- Sack Tie String -->
  <path d="M 92 46 Q 100 38 108 46" stroke="#E65100" stroke-width="2" fill="none"/>
  <!-- Flour Stamp Seal -->
  <circle cx="100" cy="85" r="18" fill="#FFF3E0" stroke="#FF8A00" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="100" y="88" text-anchor="middle" font-family="'Segoe UI', Poppins, sans-serif" font-size="10" font-weight="800" fill="#E65100">ATTA</text>
  <text x="100" y="96" text-anchor="middle" font-family="'Segoe UI', Poppins, sans-serif" font-size="6.5" font-weight="700" fill="#8D6E63">100% WHEAT</text>
  <!-- Wheat Stalks Left and Right -->
  <path d="M 45 60 Q 52 85 58 115" stroke="#FFA000" stroke-width="2" fill="none"/>
  <ellipse cx="46" cy="65" rx="5" ry="2.5" transform="rotate(-30 46 65)" fill="url(#wheatSpike)"/>
  <ellipse cx="50" cy="74" rx="5" ry="2.5" transform="rotate(30 50 74)" fill="url(#wheatSpike)"/>
  <ellipse cx="48" cy="84" rx="5" ry="2.5" transform="rotate(-30 48 84)" fill="url(#wheatSpike)"/>
  <!-- Badge Tag -->
  <rect x="14" y="14" width="94" height="20" rx="10" fill="#FFFFFF" stroke="#FF8A00" stroke-width="1.2"/>
  <circle cx="24" cy="24" r="3.5" fill="#FF8A00"/>
  <text x="34" y="27.5" font-family="'Segoe UI', Poppins, sans-serif" font-size="9" font-weight="700" fill="#D84315">WHEAT ATTA</text>
  <text x="100" y="142" text-anchor="middle" font-family="'Segoe UI', Poppins, sans-serif" font-size="9" font-weight="600" fill="#795548">Whole Grain Flour Barrier</text>
</svg>