<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <linearGradient id="snackBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="200" height="160" rx="16" fill="#151F30"/>
  <!-- Nitrogen-Flushed Pillow Pouch -->
  <path d="M 50 25 L 150 25 L 140 135 L 60 135 Z" fill="url(#snackBag)" stroke="#334155" stroke-width="2"/>
  <!-- Top Fin Seal (Crimped) -->
  <rect x="48" y="20" width="104" height="10" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <line x1="55" y1="20" x2="55" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="65" y1="20" x2="65" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="75" y1="20" x2="75" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="85" y1="20" x2="85" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="95" y1="20" x2="95" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="105" y1="20" x2="105" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="115" y1="20" x2="115" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="125" y1="20" x2="125" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="135" y1="20" x2="135" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="145" y1="20" x2="145" y2="30" stroke="#334155" stroke-width="1"/>
  <!-- Bottom Fin Seal -->
  <rect x="58" y="132" width="84" height="8" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <!-- Metallic Barrier Sheen Ribbon -->
  <path d="M 54 65 Q 100 50 146 65 L 143 85 Q 100 70 57 85 Z" fill="url(#foilSheen)" opacity="0.85"/>
  <text x="100" y="78" font-family="sans-serif" font-size="9" font-weight="700" fill="#0B1220" text-anchor="middle" letter-spacing="1">MET-BARRIER N2</text>
  <!-- Potato Chips Falling Foreground -->
  <ellipse cx="78" cy="115" rx="16" ry="9" transform="rotate(-15 78 115)" fill="url(#chipGrad)" stroke="#B45309" stroke-width="1"/>
  <ellipse cx="120" cy="120" rx="18" ry="10" transform="rotate(20 120 120)" fill="url(#chipGrad)" stroke="#B45309" stroke-width="1"/>
  <ellipse cx="100" cy="108" rx="14" ry="8" transform="rotate(5 100 108)" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
  <!-- Badge -->
  <rect x="14" y="14" width="76" height="18" rx="9" fill="#1E293B" stroke="#14B8A6" stroke-width="1"/>
  <circle cx="23" cy="23" r="3" fill="#14B8A6"/>
  <text x="32" y="26" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#F8FAFC">SNACKS</text>
</svg>
